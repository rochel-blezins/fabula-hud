<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fabula Ultima HUD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=4" />
</head>
<body>
  <div class="hud-container">
    <header id="main-header" class="jrpg-header">
      <h1>FABULA HUD</h1>
      <div class="header-actions">
        <button id="btn-add-clock" class="jrpg-btn clock-btn" title="Criar Relógio no Mapa">+ Clock</button>
        <button id="btn-add-char" class="jrpg-btn" title="Adicionar Personagem">+ Herói</button>
      </div>
    </header>

    <!-- Lista de personagens (ou card único no modo Token) -->
    <main id="party-list" class="party-list"></main>

    <!-- Seção de Relógios Ativos no Mapa (oculta no modo Token) -->
    <section id="clocks-section" class="clocks-section">
      <div class="section-divider">
        <span>RELÓGIOS NO MAPA</span>
      </div>
      <div id="clocks-list" class="clocks-list"></div>
    </section>
  </div>

  <!-- Modal para criar/editar personagem -->
  <dialog id="char-modal" class="jrpg-modal">
    <form id="char-form" method="dialog">
      <h2 id="modal-title">Novo Herói</h2>
      <input type="hidden" id="char-id" />
      
      <label>Nome do Personagem
        <input type="text" id="char-name" required placeholder="Ex: Blair" />
      </label>

      <label>URL do Portrait (Imagem)
        <input type="url" id="char-img" placeholder="https://..." />
      </label>

      <div class="grid-2">
        <label>PV Máximo
          <input type="number" id="char-hp-max" value="50" min="1" required />
        </label>
        <label>PM Máximo
          <input type="number" id="char-mp-max" value="50" min="1" required />
        </label>
      </div>

      <div class="grid-3">
        <label>PI Máx
          <input type="number" id="char-ip-max" value="6" min="1" required />
        </label>
        <label>DEF Física
          <input type="number" id="char-def" value="10" required />
        </label>
        <label>DEF Mágica
          <input type="number" id="char-mdef" value="10" required />
        </label>
      </div>

      <label>Pontos de Fabula Iniciais
        <input type="number" id="char-fp" value="3" min="0" required />
      </label>

      <div class="modal-actions">
        <button type="button" id="btn-cancel" class="jrpg-btn secondary">Cancelar</button>
        <button type="submit" class="jrpg-btn">Salvar</button>
      </div>
    </form>
  </dialog>

  <!-- Modal para vincular Token a um Herói -->
  <dialog id="link-modal" class="jrpg-modal">
    <form id="link-form" method="dialog">
      <h2>Vincular Token ao Herói</h2>
      <input type="hidden" id="target-token-id" />
      <label>Selecione o personagem deste token:
        <select id="hero-select" required></select>
      </label>
      <div class="modal-actions">
        <button type="button" id="btn-cancel-link" class="jrpg-btn secondary">Cancelar</button>
        <button type="submit" class="jrpg-btn">Vincular</button>
      </div>
    </form>
  </dialog>

  <!-- Modal para criar novo Relógio (Clock) no Mapa -->
  <dialog id="clock-modal" class="jrpg-modal">
    <form id="clock-form" method="dialog">
      <h2>Novo Relógio de Progresso</h2>
      
      <label>Título do Relógio
        <input type="text" id="clock-name" required placeholder="Ex: Ritual do Vilão" maxlength="26" />
      </label>

      <div class="grid-2">
        <label>Segmentos
          <select id="clock-segments">
            <option value="4">4 Segmentos</option>
            <option value="6" selected>6 Segmentos</option>
            <option value="8">8 Segmentos</option>
            <option value="10">10 Segmentos</option>
            <option value="12">12 Segmentos</option>
          </select>
        </label>

        <label>Tema / Cor
          <select id="clock-color">
            <option value="#e2c07d">Dourado (Objetivo)</option>
            <option value="#e74c3c">Carmesim (Perigo)</option>
            <option value="#3498db">Safira (Magia)</option>
            <option value="#2ecc71">Esmeralda (Aliados)</option>
          </select>
        </label>
      </div>

      <div class="modal-actions">
        <button type="button" id="btn-cancel-clock" class="jrpg-btn secondary">Cancelar</button>
        <button type="submit" class="jrpg-btn">Colocar no Mapa</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="app.js?v=4"></script>
</body>
</html>
